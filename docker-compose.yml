services:
#database service container saving data to local
  db:
    image: postgres:16-alpine
    container_name: fastapi_postgres_data
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - app_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-fastapi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
#webapp service container to host the web app
  web:
    build: .
    container_name: fastapi_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # In Docker, the database host is the service name "db"
      DB_HOSTNAME: db
      DB_PORT: 5432
    ports:
      - "8000"  # Directly maps port 80 to FastAPI (or 8000 if using external Nginx/SSL)
    command: >
      sh -c "alembic upgrade head &&
             gunicorn -w 2 -k uvicorn.workers.UvicornWorker app_build.main:app --bind 0.0.0.0:8000"
  nginx:
    image: nginx:1.27-alpine
    container_name: fastapi_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - web


volumes:
  app_data: